name: Research Terms

on:
  push:
    paths:
      - 'queue.txt'

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic

      - name: Read queue.txt
        id: queue
        run: |
          cat queue.txt

      - name: Research terms and update entries.json
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          from anthropic import Anthropic

          # Load existing entries
          entries_path = Path('docs/entries.json')
          if entries_path.exists():
              with open(entries_path, 'r') as f:
                  entries = json.load(f)
          else:
              entries = {}

          # Parse queue.txt
          queue_path = Path('queue.txt')
          if not queue_path.exists():
              print("queue.txt not found")
              exit(0)

          with open(queue_path, 'r') as f:
              lines = f.readlines()

          # Get existing categories and terms
          existing_categories = set()
          existing_terms_lower = set()
          for entry in entries.values():
              existing_categories.add(entry.get('category', ''))
              existing_terms_lower.add(entry.get('term', '').lower())

          # Parse queue
          queue_terms = []
          seen = set()
          for line in lines:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              if line.lower() not in seen:
                  queue_terms.append(line)
                  seen.add(line.lower())

          if not queue_terms:
              print("No new terms to research")
              exit(0)

          # Initialize Claude client
          client = Anthropic()

          # Research each term
          for term in queue_terms:
              if term.lower() in existing_terms_lower:
                  print(f"Skipping {term} (already researched)")
                  continue

              print(f"Researching: {term}")

              # Build category list for Claude
              cat_list = ', '.join(sorted(existing_categories)) if existing_categories else "(none yet)"

              # Create research prompt
              prompt = f'''You are the research engine for "AI Wiki", a living encyclopedia of artificial-intelligence terminology.

          Research this term and write its wiki entry: "{term}"

          Existing categories in the wiki: {cat_list}
          Choose the single best-fitting category. Strongly prefer reusing an existing category if one fits. Only invent a NEW category when none of the existing ones genuinely fit. Categories are broad themes (e.g. "Model Architectures", "Training Methods", "Alignment & Safety", "Inference & Serving", "Agents", "Interpretability", "Protocols & Tooling"). Use Title Case, 1-3 words.

          Respond with ONLY a valid JSON object, no markdown, in exactly this shape:
          {{
            "term": "the canonical name of the term",
            "category": "one category",
            "tldr": "one crisp sentence (max 24 words) defining it",
            "significance": "2-3 sentences on why it matters / what problem it solves",
            "related": ["3-5 closely related AI concepts as short term names"]
          }}

          If "{term}" is not a real AI/ML concept, still classify it under the closest category and say so in the tldr. Keep everything concise.'''

              try:
                  response = client.messages.create(
                      model="claude-3-5-sonnet-20241022",
                      max_tokens=500,
                      messages=[{"role": "user", "content": prompt}]
                  )

                  result_text = response.content[0].text

                  # Parse JSON from response
                  # Try direct parse first
                  try:
                      data = json.loads(result_text)
                  except json.JSONDecodeError:
                      # Strip markdown code fences if present
                      if '```' in result_text:
                          start = result_text.find('{')
                          end = result_text.rfind('}') + 1
                          if start != -1 and end > start:
                              result_text = result_text[start:end]
                      data = json.loads(result_text)

                  # Create slug from term
                  slug = data.get('term', term).lower().strip()
                  slug = slug.replace(' ', '-').replace('_', '-')
                  slug = ''.join(c for c in slug if c.isalnum() or c == '-')
                  slug = slug.strip('-')

                  # Create entry
                  entry = {
                      "term": data.get('term', term).strip(),
                      "queryTerm": term,
                      "category": data.get('category', 'Uncategorized').strip(),
                      "slug": slug,
                      "tldr": data.get('tldr', '').strip(),
                      "significance": data.get('significance', '').strip(),
                      "related": [r.strip() for r in data.get('related', []) if isinstance(r, str)] or [],
                      "firstSeen": "2024-01-01T00:00:00.000Z"
                  }

                  # Add to entries
                  entries[slug] = entry
                  existing_categories.add(entry['category'])
                  print(f"  ✓ Filed under {entry['category']}")

              except Exception as e:
                  print(f"  ✗ Error: {str(e)}")
                  continue

          # Save entries.json
          with open(entries_path, 'w') as f:
              json.dump(entries, f, indent=2)
          print(f"\nUpdated docs/entries.json with {len(entries)} total entries")

          EOF

      - name: Commit changes
        run: |
          git config user.name "AI Wiki Action"
          git config user.email "action@github.com"
          git add docs/entries.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: update entries from queue.txt"
            git push
          fi
